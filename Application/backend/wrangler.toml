name = "pixel-party-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pixel-party-db"
database_id = "REPLACE_AFTER_wrangler_d1_create"

[vars]
CORS_ORIGIN = "https://pixel-party.pages.dev"

# Secrets set via: wrangler secret put <NAME>
# JWT_SECRET
# RESEND_API_KEY
# ADMIN_EMAIL
# ADMIN_PASSWORD
